<?xml version="1.0" encoding="utf-8" standalone="no"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

<!-- This file is a helper to test and validate output of mathml2braille.js
on the PC instead of device. Modify the mathml at will and load in the browser
 Chrome://inspect is handy-->

<head>
    <style>@font-face {
        font-family: "Quivira";
        src: url('../Quivira.ttf');
    }
    .js-mathmlConverti {
        font-family: 'Quivira';
        color: red;
    }
    </style>

<script type="text/javascript">
    function getExpressionInBraille()
    {
        var result = "NOTHING";
        var elements = document.getElementsByClassName('js-mathmlConverti');
        //should be only one...
        Array.prototype.forEach.call(elements,(element => {
            console.log(element.innerHTML);
            result = element.innerHTML;
        }));

        return result;

    }

</script>

</head>
<body>
<div>
    <p class="courant">
			<span>H2O</span>
			<math xmlns="http://www.w3.org/1998/Math/MathML" class="js-math2braille ">
				<mrow>
					<msub>
						<mi>H</mi>
						<mn>2</mn>
					</msub>
					<mi>O</mi>
				</mrow>
			</math>
			<span class="mathbraille">⠠⠓⠢⠼⠃⠠⠕</span>
		</p>

</div>

<div>
    <p class="courant">
			<span>H(sup)2)O</span>
			<math xmlns="http://www.w3.org/1998/Math/MathML" class="js-math2braille ">
				<mrow>
					<msup>
						<mi>H</mi>
						<mn>2</mn>
					</msup>
					<mi>O</mi>
				</mrow>
			</math>
			<span class="mathbraille">⠠⠓⠔⠼⠃⠠⠕</span>
		</p>

</div>

<script type="text/javascript" src='../FrenchTables.js' ></script>
<script type="text/javascript" src='../NemethTables.js' ></script>
<script type="text/javascript" src='../UEBTables.js' ></script>
<script type="text/javascript" src='../mathml2braille.js' ></script>
<script>
        var options1 = {
			'codeBrailleMath': 'ueb', // 3 options : "fr", "nemeth" et "ueb". "fr" par defaut
			'maxCaracCell': 14 //correspond à peu près au nombre limite de carac dans la cellule avant de basculer en mode linéaire (10 par défaut)
		};

           new Mathml2braille('.js-math2braille',options1);

           console.log("created Mathml2braille");

    </script>


</body>
</html>
